# Sargam desktop shell (Tauri v2). Requires system packages:
#   sudo apt install libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
#   cargo install tauri-cli --version '^2'
# Then, from the repo root:
#   cargo tauri dev    # run the app
#   cargo tauri build  # installers

[package]
name = "sargam-desktop"
version = "0.1.0"
edition = "2021"

# Android loads the app as a JNI cdylib, so the shared Tauri setup lives in
# lib.rs behind a library target; the desktop binary (main.rs) just calls its
# run(). staticlib is for iOS, rlib so `cargo test`/other crates can still
# depend on this normally.
[lib]
name = "sargam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "sargam-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
composer-core = { path = "../composer-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not native-tls/OpenSSL) so this never depends on the system's TLS
# libraries being present — matches the project's preference for
# self-contained builds (relevant again once mobile targets need this too).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# Already in the dependency tree transitively via Tauri, so pulling it in
# directly (to generate track/storage-path ids in marketplace.rs) adds no
# extra compile weight.
uuid = { version = "1", features = ["v4"] }
log = "0.4"

# On Android, Rust stdout/stderr don't reach logcat and there's no console —
# route `log` to logcat so audio-init (and other) diagnostics are visible.
# ndk-context: tao/wry never populate the global Android context that cpal's
# AAudio backend reads, so we initialize it ourselves in JNI_OnLoad (see lib.rs)
# to fix "no sound on Android". Already in the tree transitively — pulling it in
# directly adds no compile weight.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
ndk-context = "0.1"
