# Sargam desktop shell (Tauri v2). Requires system packages:
#   sudo apt install libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
#   cargo install tauri-cli --version '^2'
# Then, from the repo root:
#   cargo tauri dev    # run the app
#   cargo tauri build  # installers

[package]
name = "sargam-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
composer-core = { path = "../composer-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not native-tls/OpenSSL) so this never depends on the system's TLS
# libraries being present — matches the project's preference for
# self-contained builds (relevant again once mobile targets need this too).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# Already in the dependency tree transitively via Tauri, so pulling it in
# directly (to generate track/storage-path ids in marketplace.rs) adds no
# extra compile weight.
uuid = { version = "1", features = ["v4"] }
