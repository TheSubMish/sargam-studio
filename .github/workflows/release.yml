name: release

# Builds installers for Windows, macOS (Intel + Apple Silicon), and Linux and
# attaches them to a GitHub Release. The frontend (ui/) has no build step
# (plain HTML/CSS/JS per CLAUDE.md), so there's no Node/npm setup here — just
# Rust + Tauri's own bundler.
#
# Trigger: push a tag like `v0.1.0`, or run manually from the Actions tab.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, STRIPE_PUBLISHABLE_KEY
# These are the same *publishable*-only values that go in a local .env —
# never a service_role key, DB password, or Stripe secret key (see
# CLAUDE.md's Supabase section).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache cargo
        uses: swatinem/rust-cache@v2

      - name: write repo-root .env (publishable keys only)
        shell: bash
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/composer-desktop
          tagName: v__VERSION__
          releaseName: "Sargam v__VERSION__"
          releaseBody: "See the assets below to download Sargam for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
