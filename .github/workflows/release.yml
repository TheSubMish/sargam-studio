name: release

# Builds Sargam desktop installers for Linux, Windows, and macOS and attaches
# them to a single GitHub Release:
#   Linux   → .deb / .rpm / .AppImage
#   Windows → .msi (WiX) / .exe (NSIS)
#   macOS   → .dmg / .app  (universal — Intel + Apple Silicon)
#
# The frontend (ui/) has no build step (plain HTML/CSS/JS per CLAUDE.md), so
# there's no Node/npm setup — just Rust + Tauri's own bundler. Each OS must
# build on its own runner (desktop apps can't be cross-compiled in practice);
# tauri-action merges every job's assets into the same release, keyed by tag.
#
# The builds are UNSIGNED. Windows shows a SmartScreen prompt and macOS an
# "unidentified developer" warning on first launch; users can still run them.
# Add code-signing certificates (and notarization on macOS) before a wide
# release — see tauri-action's docs for the signing inputs/secrets.
#
# Trigger: push a tag like `v0.1.0`, or run manually from the Actions tab.
# The release is created as a DRAFT — review it, then publish so that
# github.com/<owner>/<repo>/releases/latest (the website's Download button)
# resolves to it.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, STRIPE_PUBLISHABLE_KEY
# These are the same *publishable*-only values that go in a local .env —
# never a service_role key, DB password, or Stripe secret key (see
# CLAUDE.md's Supabase section).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (not latest) for a wider glibc compatibility floor on
          # the .deb/.AppImage.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # One universal .dmg that runs on both Intel and Apple Silicon Macs.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libasound2-dev

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: cache cargo
        uses: swatinem/rust-cache@v2
        with:
          # Keep each OS's cache separate.
          key: ${{ matrix.platform }}

      - name: write repo-root .env (publishable keys only)
        # bash is available on all three runners (Git Bash on Windows), so the
        # heredoc works everywhere.
        shell: bash
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/composer-desktop
          tagName: v__VERSION__
          releaseName: "Sargam v__VERSION__"
          releaseBody: "See the assets below to download Sargam for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
