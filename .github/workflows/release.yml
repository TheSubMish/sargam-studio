name: release

# Builds a Linux installer (.deb/.rpm/.AppImage) and attaches it to a GitHub
# Release. The frontend (ui/) has no build step (plain HTML/CSS/JS per
# CLAUDE.md), so there's no Node/npm setup here — just Rust + Tauri's own
# bundler.
#
# Windows/macOS were dropped from this workflow for now (kept it simple while
# getting the pipeline working) — revisit by adding matrix entries back once
# Linux is solid.
#
# Trigger: push a tag like `v0.1.0`, or run manually from the Actions tab.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, STRIPE_PUBLISHABLE_KEY
# These are the same *publishable*-only values that go in a local .env —
# never a service_role key, DB password, or Stripe secret key (see
# CLAUDE.md's Supabase section).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: swatinem/rust-cache@v2

      - name: write repo-root .env (publishable keys only)
        shell: bash
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/composer-desktop
          tagName: v__VERSION__
          releaseName: "Sargam v__VERSION__"
          releaseBody: "See the assets below to download Sargam for your platform."
          releaseDraft: true
          prerelease: false
