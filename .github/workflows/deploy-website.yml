name: Deploy website

# Publishes the static marketing + legal site in website/ to GitHub Pages.
# Enable once in the repo: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Then every push to main that touches website/ redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement:true lets this workflow turn Pages on (build type: GitHub
        # Actions) so you don't have to flip it in Settings first. If it can't
        # (e.g. org restrictions), enable it manually: Settings → Pages →
        # Source → "GitHub Actions".
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
